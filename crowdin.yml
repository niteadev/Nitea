# Crowdin Configuration File for Nitea Focus Application
# Reference: https://developer.crowdin.com/configuration-file/

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

# Base branch configuration
base_path: .
base_url: https://api.crowdin.com
preserve_hierarchy: true

# File mapping configuration
files:
  - source: /src/renderer/src/languages/en.json
    translation: /src/renderer/src/languages/%two_letters_code%.json
    type: json
    multilingual: false

# Language mapping overrides for standard ISO codes
language_mapping:
  two_letters_code:
    zh-CN: zh
    zh-TW: zh-TW
